
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0d0d10">
  <title>quadra</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #0d0d10;
      color: #f4f4f5;
      font-family: system-ui, -apple-system, sans-serif;
    }

    main {
      text-align: center;
      padding: 24px;
      max-width: 420px;
    }

    .logo {
      font-size: 2.5rem;
      font-weight: 700;
      letter-spacing: -2px;
      margin-bottom: 40px;
    }

    .logo span { color: #b9a4ff; }

    .icon {
      font-size: 28px;
      color: #b9a4ff;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 1.7rem;
      font-weight: 600;
      letter-spacing: -0.8px;
      margin: 0 0 12px;
    }

    p {
      color: #92929e;
      font-size: 14px;
      line-height: 1.7;
      margin-bottom: 28px;
    }

    a {
      display: inline-block;
      padding: 12px 24px;
      border: 1px solid #38323f;
      border-radius: 10px;
      background: #211b2c;
      color: #e4d9ff;
      font-size: 14px;
      font-weight: 500;
      text-decoration: none;
      transition: all .2s ease;
    }

    a:hover {
      background: #322543;
      border-color: #b9a4ff;
      transform: translateY(-2px);
    }
  </style>
</head>

<body>
  <main>
    <div class="logo">quadrahq (previously ciderhq)<span></span></div>
    

    <h1>we rebranded (unfortunately)</h1>
    <p>
      our domain has changed.<br>
      you can now find us at quadrahq.org
    </p>

    <a href="https://quadrahq.org">
      visit quadrahq.org :3
    </a>
  </main>
</body>
</html>
